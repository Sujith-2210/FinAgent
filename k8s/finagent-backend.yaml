apiVersion: apps/v1
kind: Deployment
metadata:
  name: finagent-backend
  labels:
    app: finagent
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finagent
  template:
    metadata:
      labels:
        app: finagent
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: backend
        image: finagent-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        - name: DATABASE_URL
          value: "sqlite+aiosqlite:///./data/finagent.db" # Should use Postgres in real prod
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: finagent-service
spec:
  selector:
    app: finagent
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8000
  type: ClusterIP
