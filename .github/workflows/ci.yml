name: FinAgent CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # Backend: Lint + Test
  # ─────────────────────────────────────────────
  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest-cov

      - name: Lint with Ruff
        run: |
          ruff check app/ --select E,F,W --ignore E501,E402,F401

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
          LLM_PROVIDER: gemini
          DATABASE_URL: sqlite+aiosqlite:///./test.db
          PYTHONPATH: .
        run: |
          python -m pytest app/tests/ -v --tb=short -q

      - name: Check app imports
        run: |
          python -c "
          try:
              from app.main import app
              print('✅ Backend imports OK')
          except ImportError as e:
              print(f'⚠️ Optional import missing (non-critical): {e}')
              # Non-zero exit only for critical failures
              if 'app.main' in str(e):
                  exit(1)
              print('✅ Backend core structure OK')
          "

  # ─────────────────────────────────────────────
  # Frontend: Lint + Build
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --ext .ts,.tsx --max-warnings 50

      - name: Build production bundle
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7
